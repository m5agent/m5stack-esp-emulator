name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run platform tests and contract checks
        env:
          PYTHONPATH: platform/tools
        run: |
          python3 -m unittest discover \
            -s platform/tests -p 'test_*.py'
          python3 platform/tools/qemu_profiles.py --check
          python3 platform/tools/peripheral_catalog.py --check
          python3 platform/tools/runtime_coverage.py --check
      - name: Compile Python entry points
        run: |
          python3 -m compileall -q platform tests
      - name: Run browser upload unit tests
        run: |
          node platform/tests/test_sha256.mjs
          node platform/tests/test_firmware_upload.mjs
      - name: Test worker credential generation migration
        run: |
          python3 tests/network/worker_tls/run_fleet_migration_test.py \
            --out /tmp/m5-fleet-credential-migration.json

  network-namespace-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux network fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 nftables
      - name: Run fail-closed CIDR/dual-stack egress test
        run: |
          sudo sysctl --write net.ipv4.ip_forward=1
          sudo sysctl --write net.ipv6.conf.all.forwarding=1
          sudo env \
            "PATH=$PATH" \
            "PYTHONPATH=$GITHUB_WORKSPACE/platform/tools" \
            python3 tests/network/egress_allowlist/run_test.py \
            --out-dir /tmp/m5-egress-allowlist
      - name: Validate two-guest lab fabric primitives
        run: |
          sudo env \
            "PATH=$PATH" \
            "PYTHONPATH=$GITHUB_WORKSPACE/platform/tools" \
            python3 tests/network/lab_fabric/check_fabric.py \
            --out-dir /tmp/m5-lab-fabric
      - name: Validate cross-network-namespace worker control plane
        run: |
          sudo env \
            "PATH=$PATH" \
            "PYTHONPATH=$GITHUB_WORKSPACE/platform/tools" \
            python3 tests/network/worker_cross_netns/run_test.py \
            --out-dir /tmp/m5-worker-cross-netns
      - name: Validate authenticated worker discovery and token rotation
        env:
          PYTHONPATH: platform/tools
        run: |
          python3 tests/network/worker_discovery/run_test.py \
            --out-dir /tmp/m5-worker-discovery
      - name: Validate unicast discovery through NAT and separate subnets
        run: |
          sudo sysctl --write net.ipv4.ip_forward=1
          sudo env \
            "PATH=$PATH" \
            "PYTHONPATH=$GITHUB_WORKSPACE/platform/tools" \
            python3 tests/network/worker_discovery_seed/run_test.py \
            --out-dir /tmp/m5-worker-discovery-seed
      - name: Preserve network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-namespace-evidence
          path: |
            /tmp/m5-egress-allowlist
            /tmp/m5-lab-fabric
            /tmp/m5-worker-cross-netns
            /tmp/m5-worker-discovery
            /tmp/m5-worker-discovery-seed/evidence.json
          if-no-files-found: warn
