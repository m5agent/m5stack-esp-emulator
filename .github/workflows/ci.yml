name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog-and-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate device catalog and QEMU profiles
        run: |
          python3 platform/tests/test_catalog.py
          python3 platform/tests/test_qemu_profiles.py
          python3 platform/tools/qemu_profiles.py --check
      - name: Compile Python entry points
        run: |
          python3 -m compileall -q platform tests
