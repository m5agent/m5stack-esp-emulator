name: Hosted QEMU Worker diagnostics only

on:
  push:
    branches: [m5agent/pages-hosted-worker-diagnostic-20261110]

permissions:
  actions: read
  contents: read

jobs:
  reproduce:
    if: github.repository == 'm5agent/m5stack-esp-emulator' && github.ref == 'refs/heads/m5agent/pages-hosted-worker-diagnostic-20261110'
    runs-on: macos-15
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read pinned producer metadata and runtime archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          producer=1979809883489d92ffe7e5461fa17b26f06a89ed
          git fetch --no-tags --depth=1 origin "$producer"
          input=.work/hosted-diagnostic-input
          mkdir -p "$input"
          api="repos/$GITHUB_REPOSITORY/actions"
          gh api "$api/runs/42770355747/attempts/1" > "$input/run.json"
          gh api "$api/runs/42770355747/attempts/1/jobs" > "$input/jobs.json"
          gh api "$api/runs/42770355747/artifacts" > "$input/artifacts.json"
          gh api --allow-escape-sequences "$api/artifacts/13741959101/zip" > "$input/xtensa.zip"
          gh api --allow-escape-sequences "$api/artifacts/13741639246/zip" > "$input/c61.zip"
      - name: Verify exact artifacts and export to the private runner workspace
        env:
          PYTHONPATH: platform/tools
        run: python3 platform/tests/prepare_hosted_qemu_diagnostic.py .work/hosted-diagnostic-input .work/hosted-diagnostic
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked browser acceptance tools
        run: npm ci --prefix platform/tests && npm exec --prefix platform/tests -- playwright install --with-deps chromium
      - name: Alternate self-close and owner termination for three rounds
        env:
          NODE_PATH: ${{ github.workspace }}/platform/tests/node_modules
          M5_PUBLIC_SITE: ${{ github.workspace }}/.work/hosted-diagnostic/site
          M5_PUBLIC_BASE_PATH: /m5stack-esp-emulator/
          M5_WASM_GPU: hardware
          M5_WASM_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          M5_QEMU_READY_TIMEOUT_MS: "600000"
          M5_QEMU_DEVICE: cardputer-adv
          M5_QEMU_BUTTON_HOLD_MS: "250"
          M5_CARDPUTER_KEYBOARD_IRQ: "1"
          M5_CARDPUTER_WORKER_DIAG_KEYS: K,L,DOT
          M5_CARDPUTER_WORKER_ACTIVE_MS: "30000"
          M5_CARDPUTER_WORKER_PROBE_LINGER: "1"
        run: |
          failed=0
          results=.work/hosted-diagnostic/worker-mode-exit-status.tsv
          printf 'round\tmode\texit_status\n' > "$results"
          for round in 1 2 3; do
            for mode in finalize-self finalize-owner; do
              printf 'Worker diagnostic round %s, mode %s\n' "$round" "$mode"
              export M5_CARDPUTER_WORKER_DIAG="$mode"
              export M5_PUBLIC_QEMU_OUT="$GITHUB_WORKSPACE/.work/hosted-diagnostic/guest-round-$round-$mode"
              status=0
              node platform/tests/test_public_uiflow_cardputer_keyboard_guest.mjs || status=$?
              printf '%s\t%s\t%s\n' "$round" "$mode" "$status" >> "$results"
              if [ "$status" -ne 0 ]; then failed=1; fi
            done
          done
          exit "$failed"
      - name: Retain diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-worker-repeat-${{ github.run_attempt }}
          path: |
            .work/hosted-diagnostic/provenance.json
            .work/hosted-diagnostic/worker-mode-exit-status.tsv
            .work/hosted-diagnostic/guest-*/report.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
