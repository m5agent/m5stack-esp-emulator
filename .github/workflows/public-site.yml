name: Prepare public simulator site

# The default run produces a downloadable preview only. Publication requires an
# explicit main-branch dispatch after approval and preconfigured Pages settings.
# This workflow never enables Pages or changes the repository's Pages source.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish approved site to GitHub Pages (main only)"
        type: boolean
        required: true
        default: false
      reuse_verified_runtimes:
        description: "Reuse only the pinned full source builds from run 42777985298 (main only)"
        type: boolean
        required: false
        default: false
      base_path:
        description: "Pages path prefix (for example /m5stack-esp-emulator/)"
        required: true
        default: "/m5stack-esp-emulator/"
      service_url:
        description: "Optional HTTPS Device Service URL without credentials"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: public-simulator-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build_runtimes:
    permissions:
      actions: read
      contents: read
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [xtensa-softmmu, riscv32-softmmu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import the pinned prior runtime for this target
        if: ${{ inputs.reuse_verified_runtimes }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: platform/tools
          QEMU_RUNTIME_TARGET: ${{ matrix.target }}
        run: python3 scripts/qemu-wasm-build/reuse_pages_runtime.py "$QEMU_RUNTIME_TARGET"
      - name: Install native source build tools
        if: ${{ !inputs.reuse_verified_runtimes }}
        run: |
          brew install autoconf automake libtool bison flex ninja pkg-config xz
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned upstream release archives
        if: ${{ !inputs.reuse_verified_runtimes }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive_cache=.work/qemu-source-downloads
          mkdir -p "$archive_cache"
          fetch_verified() {
            local url="$1" partial="$2" bytes="$3" sha256="$4"
            shift 4
            rm -f "$partial"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 2 --retry-max-time 90 \
              --max-filesize "$bytes" --output "$partial" "$@" "$url" &&
              test "$(wc -c < "$partial" | tr -d '[:space:]')" = "$bytes" &&
              test "$(shasum -a 256 "$partial" | cut -d ' ' -f 1)" = "$sha256"
          }
          fetch_release_asset() {
            local repository="$1" asset="$2" filename="$3" bytes="$4"
            local destination="$archive_cache/$filename" locked url sha256
            local api="https://api.github.com/repos/$repository/releases/assets/$asset"
            locked="$(python3 -c '
          import json, sys
          with open("scripts/qemu-wasm-build/sources.lock.json") as lock:
              archive, = (row for row in json.load(lock)["archives"] if row["filename"] == sys.argv[1])
          print(archive["url"], archive["sha256"])
          ' "$filename")"
            read -r url sha256 <<< "$locked"
            echo "download: $filename"
            if ! fetch_verified "$url" "$destination.part" "$bytes" "$sha256"; then
              echo "Retrying $filename through the release asset API"
              fetch_verified "$api" "$destination.part" "$bytes" "$sha256" \
                --header 'Accept: application/octet-stream' --header "Authorization: Bearer $GH_TOKEN" ||
                fetch_verified "$api" "$destination.part" "$bytes" "$sha256" \
                  --header 'Accept: application/octet-stream'
            fi
            mv "$destination.part" "$destination"
          }
          # The source builder still checks the SHA-256 in each target's lock.
          fetch_release_asset libffi/libffi 227440472 libffi-3.4.7.tar.gz 1393979
          fetch_release_asset PCRE2Project/pcre2 172496647 pcre2-10.44.tar.bz2 1928086
          fetch_release_asset mesonbuild/wrapdb 192615396 pcre2_10.44-2_patch.zip 3644
      - name: Build pinned C/QEMU and complete corresponding source
        if: ${{ !inputs.reuse_verified_runtimes && matrix.target == 'xtensa-softmmu' }}
        run: python3 platform/tools/bootstrap_qemu_browser_runtime.py --jobs 2 --downloads .work/qemu-source-downloads
      - name: Build pinned CoreMatrix C61 QEMU and corresponding source
        if: ${{ !inputs.reuse_verified_runtimes && matrix.target == 'riscv32-softmmu' }}
        run: |
          python3 platform/tools/bootstrap_qemu_browser_runtime.py --target riscv32-softmmu --jobs 2 \
            --cache .work/qemu-c61-runtime-build --output .work/qemu-c61-runtime \
            --downloads .work/qemu-source-downloads
      - name: Build browser-local demo composer
        if: ${{ !inputs.reuse_verified_runtimes && matrix.target == 'xtensa-softmmu' }}
        run: python3 scripts/browser-littlefs/build.py --emcc .work/qemu-browser-runtime-build/emsdk/upstream/emscripten/emcc
      - uses: actions/setup-node@v4
        if: ${{ !inputs.reuse_verified_runtimes && matrix.target == 'xtensa-softmmu' }}
        with:
          node-version: "22"
      - name: Verify the WASM32 helper ABI against the pinned libffi
        if: ${{ !inputs.reuse_verified_runtimes && matrix.target == 'xtensa-softmmu' }}
        run: python3 tests/browser-qemu/typed_helpers/build.py --emcc .work/qemu-browser-runtime-build/emsdk/upstream/emscripten/emcc --ffi-prefix .work/qemu-browser-runtime-build/target --out-dir .work/wasm-typed-helper-control
      - name: Retain failed source build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-source-build-diagnostics-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            .work/qemu-browser-runtime-build/logs
            .work/qemu-c61-runtime-build/logs
            .work/wasm-typed-helper-control
          if-no-files-found: ignore
      - name: Stage Xtensa runtime and composer for browser acceptance
        if: ${{ matrix.target == 'xtensa-softmmu' }}
        uses: actions/upload-artifact@v4
        with:
          name: qemu-staging-xtensa-${{ github.run_attempt }}
          path: |
            .work/qemu-browser-runtime
            .work/browser-littlefs
            .work/wasm-typed-helper-control
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Stage C61 runtime for browser acceptance
        if: ${{ matrix.target == 'riscv32-softmmu' }}
        uses: actions/upload-artifact@v4
        with:
          name: qemu-staging-c61-${{ github.run_attempt }}
          path: .work/qemu-c61-runtime
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  build:
    needs: build_runtimes
    # Normal-clock board probes run two guest CPUs beside Chromium. The
    # constrained Linux headless runner can starve a wall-clock guest into a
    # real interrupt-WDT, so keep publication acceptance on a workstation-class
    # macOS runner rather than slowing the deployed profiles or weakening the
    # guest assertions.
    runs-on: macos-15
    # Each admitted board runs independent guests, including editor reset
    # boots, after rebuilding both runtime targets from source.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Downloads are scoped to this run and names bind its current attempt.
      # Re-run all jobs to rebuild both artifacts for a new attempt.
      - name: Retrieve this run's Xtensa runtime and composer
        uses: actions/download-artifact@v4
        with:
          name: qemu-staging-xtensa-${{ github.run_attempt }}
          path: .work
      - name: Retrieve this run's C61 runtime
        uses: actions/download-artifact@v4
        with:
          name: qemu-staging-c61-${{ github.run_attempt }}
          path: .work/qemu-c61-runtime
      - name: Export reviewed browser assets
        env:
          PUBLIC_BASE_PATH: ${{ inputs.base_path }}
          PUBLIC_SERVICE_URL: ${{ inputs.service_url }}
        run: python3 platform/tools/build_public_site.py --output .work/public-site --base-path "$PUBLIC_BASE_PATH" --service-url "$PUBLIC_SERVICE_URL" --qemu-runtime .work/qemu-browser-runtime --qemu-c61-runtime .work/qemu-c61-runtime --littlefs-runtime .work/browser-littlefs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked browser acceptance tools
        run: npm ci --prefix platform/tests && npm exec --prefix platform/tests -- playwright install --with-deps chromium
      - name: Verify Canvas observation positive and negative controls
        env:
          M5_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: node platform/tests/test_public_qemu_pixel_observer_browser.mjs
      - name: Run the unmodified official CoreMatrix firmware
        env:
          M5_PUBLIC_SITE: ${{ github.workspace }}/.work/public-site
          M5_PUBLIC_QEMU_OUT: ${{ github.workspace }}/.work/public-qemu-corematrix-stock
          M5_WASM_GPU: hardware
          M5_WASM_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          M5_QEMU_READY_TIMEOUT_MS: "600000"
        run: |
          firmware_url="$(node -p 'require("./platform/web/qemu-browser-profiles.json").profiles.find(profile => profile.deviceId === "corematrix").reference.url')"
          firmware_path="$GITHUB_WORKSPACE/.work/corematrix-stock-ui-flow.bin"
          curl --fail --location --silent --show-error --retry 2 --output "$firmware_path" "$firmware_url"
          M5_QEMU_UPLOAD="$firmware_path" node platform/tests/test_public_qemu_corematrix_stock.mjs
      - name: Run every public UIFlow editor, model button and fixed example
        env:
          NODE_PATH: ${{ github.workspace }}/platform/tests/node_modules
          M5_PUBLIC_SITE: ${{ github.workspace }}/.work/public-site
          M5_PUBLIC_BASE_PATH: ${{ inputs.base_path }}
          M5_WASM_GPU: hardware
          M5_WASM_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          M5_QEMU_READY_TIMEOUT_MS: "600000"
          M5_QEMU_GATE_REQUIRE_ALL: "1"
          # Local opt-in 2 is functional-only; CI stays serial and explicit.
          M5_QEMU_GATE_WORKERS: "1"
          M5_QEMU_GATE_PHASE: all
          M5_QEMU_GATE_DEVICES: ""
        run: node platform/tests/test_public_qemu_admitted_boards.mjs
      - name: Retain browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qemu-acceptance
          path: |
            .work/public-qemu-admitted
            .work/public-qemu-corematrix-stock
            .work/wasm-typed-helper-control
            .work/public-qemu-pixel-observer-host-browser
            .work/qemu-browser-runtime/reuse-provenance.json
            .work/qemu-c61-runtime/reuse-provenance.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: public-simulator-site-preview
          path: .work/public-site
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload Pages deployment artifact
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: .work/public-site

  deploy:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
