name: Prepare public simulator site

# The default run produces a downloadable preview only. Publication requires an
# explicit main-branch dispatch after approval and preconfigured Pages settings.
# This workflow never enables Pages or changes the repository's Pages source.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish approved site to GitHub Pages (main only)"
        type: boolean
        required: true
        default: false
      base_path:
        description: "Pages path prefix (for example /m5stack-esp-emulator/)"
        required: true
        default: "/m5stack-esp-emulator/"
      service_url:
        description: "Optional HTTPS Device Service URL without credentials"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: public-simulator-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - name: Build pinned browser runtime and obtain reviewed ROM
        run: python3 platform/tools/bootstrap_browser_runtime.py --fetch-rom
      - name: Export reviewed browser assets
        env:
          PUBLIC_BASE_PATH: ${{ inputs.base_path }}
          PUBLIC_SERVICE_URL: ${{ inputs.service_url }}
        run: python3 platform/tools/build_public_site.py --output .work/public-site --base-path "$PUBLIC_BASE_PATH" --service-url "$PUBLIC_SERVICE_URL" --browser-runtime .work/browser-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: public-simulator-site-preview
          path: .work/public-site
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload Pages deployment artifact
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: .work/public-site

  deploy:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
