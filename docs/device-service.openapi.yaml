openapi: 3.1.0
info:
  title: M5Stack Device Service API
  version: 1.6.0
  description: >
    Leased, on-demand virtual M5Stack device service. QEMU unified sessions
    keep board and radio evidence in one guest; separate esp-emu network/BLE
    sessions remain available for diagnostics. Every session uses an isolated
    firmware copy.
    CardputerZero is outside this API version. Tab5 is available through
    esp-emu with partial peripheral status.
servers:
  - url: http://127.0.0.1:8787/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Service health and capacity
      security: []
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /devices:
    get:
      summary: List virtual device profiles
      parameters:
        - name: include_unsupported
          in: query
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
      responses:
        "200":
          description: Device catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCatalog"
  /devices/{device_id}:
    get:
      summary: Read one virtual device profile
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          $ref: "#/components/responses/Error"
  /capacity:
    get:
      summary: Read active lease capacity
      responses:
        "200":
          description: Capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capacity"
  /storage:
    get:
      summary: Read retained-session, cache and disk usage
      responses:
        "200":
          description: Storage inventory and active retention policy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /storage/prune:
    post:
      summary: Apply retention and optionally garbage-collect unreferenced caches
      parameters:
        - name: include_cache
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Prune result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /artifacts:
    get:
      summary: List uploaded artifacts
      responses:
        "200":
          description: Artifact list
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artifact"
    post:
      summary: Upload a content-addressed binary artifact
      parameters:
        - name: X-Artifact-Name
          in: header
          schema:
            type: string
        - name: X-Artifact-Type
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Artifact metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "413":
          $ref: "#/components/responses/Error"
        "507":
          $ref: "#/components/responses/Error"
  /artifacts/{artifact_id}:
    get:
      summary: Read artifact metadata
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Artifact metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an artifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /firmware:
    post:
      summary: Compose and validate a flash-sized firmware image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MergedFirmwareRequest"
                - $ref: "#/components/schemas/SegmentedFirmwareRequest"
                - $ref: "#/components/schemas/ManifestFirmwareRequest"
      responses:
        "201":
          description: Firmware metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "400":
          $ref: "#/components/responses/Error"
        "507":
          $ref: "#/components/responses/Error"
  /firmware/{firmware_id}:
    get:
      summary: Read firmware metadata
      parameters:
        - name: firmware_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Firmware metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "404":
          $ref: "#/components/responses/Error"
  /firmware/analyze:
    post:
      summary: Analyze an existing firmware image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firmware_id]
              properties:
                firmware_id:
                  type: string
      responses:
        "200":
          description: Static firmware analysis
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /firmware/{firmware_id}/analysis:
    get:
      summary: Read firmware analysis
      parameters:
        - name: firmware_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Static firmware analysis
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions:
    get:
      summary: List leases and retained session history
      parameters:
        - name: include_stopped
          in: query
          description: Set to 0 to return active leases only. The default includes stopped and failed sessions while they remain retained.
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
    post:
      summary: Create an asynchronous device lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "202":
          description: Session accepted for provisioning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "507":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    delete:
      summary: Clear stopped or failed session history
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [stopped, failed]
        - name: purge
          in: query
          schema:
            type: boolean
            default: true
        - name: retain_flash
          in: query
          description: Keep full virtual flash files while retaining stopped/failed history.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Clear result
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared:
                    type: integer
                  orphaned_cleared:
                    type: integer
                  purged:
                    type: boolean
  /sessions/{session_id}:
    get:
      summary: Read session state
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Stop a session
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: purge
          in: query
          schema:
            type: boolean
            default: false
        - name: retain_flash
          in: query
          description: Retain the full mutable virtual flash after stop. It is released by default.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Stopped session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /sessions/{session_id}/events:
    get:
      summary: Read session lifecycle events
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session events
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /sessions/{session_id}/network:
    get:
      summary: Read machine-readable radio evidence for one session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: >
            WiFi/BLE slice of the current QEMU lease, or RUNNING before
            completion. Unified profiles also keep frame, input, device-state
            and audio evidence in the same session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkEvidence"
        "409":
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/network-fault:
    post:
      summary: Inject a QEMU link fault for reconnect tests
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [down, up]
                  description: Sets the QEMU wifi0 backend link state through QMP set_link.
      responses:
        "200":
          description: Link state changed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/device-state:
    get:
      summary: Read normalized device runtime state
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Live or persisted device component state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  session_id:
                    type: string
                  device_id:
                    type: string
                  state:
                    type: string
                  supported:
                    type: boolean
                  available:
                    type: boolean
                  source:
                    type: string
                    enum: [live, persisted]
                  captured_at:
                    type: string
                    format: date-time
                  components:
                    type: object
                    additionalProperties: true
                  errors:
                    type: object
                    additionalProperties: true
  /sessions/{session_id}/evidence:
    get:
      summary: Download an evidence ZIP
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: include
          in: query
          schema:
            type: string
            default: manifest,serial,frames,logs,qom
      responses:
        "200":
          description: Evidence ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /sessions/{session_id}/qom/list:
    get:
      summary: List QOM properties at a path
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: path
          in: query
          schema:
            type: string
            default: /machine
      responses:
        "200":
          description: QOM property list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/qom-snapshot:
    post:
      summary: Store a recursive QOM snapshot
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  default: /machine
                depth:
                  type: integer
                  default: 2
                max_nodes:
                  type: integer
                  default: 500
      responses:
        "200":
          description: QOM snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/qom/diff:
    get:
      summary: Diff two stored QOM snapshots
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: before
          in: query
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: QOM snapshot diff
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/flash:
    get:
      summary: Read current virtual flash metadata or bytes
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: format
          in: query
          schema:
            type: string
            enum: [sha256, bin]
            default: sha256
      responses:
        "200":
          description: Flash metadata or binary image
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/octet-stream:
              schema:
                type: string
                format: binary
  /sessions/{session_id}/flash-snapshot:
    post:
      summary: Store a virtual flash snapshot
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Flash snapshot metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/flash/diff:
    get:
      summary: Diff two virtual flash snapshots
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: before
          in: query
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flash snapshot diff
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/wait:
    post:
      summary: Wait for running state or a serial marker
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ready_marker:
                  type: string
                timeout_seconds:
                  type: number
                  default: 30
                wait_for_completion:
                  type: boolean
                  default: false
                  description: Wait until a one-shot network session stops or fails.
                ready:
                  $ref: "#/components/schemas/ReadyConditions"
      responses:
        "200":
          description: Session is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "408":
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/serial:
    get:
      summary: Read serial output incrementally
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 262144
            default: 65536
      responses:
        "200":
          description: Serial chunk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialChunk"
  /sessions/{session_id}/logs:
    get:
      summary: Read serial plus runtime log tails
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Log chunks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SerialChunk"
                  - type: object
                    properties:
                      runtime:
                        $ref: "#/components/schemas/RuntimeName"
                      stdout:
                        type: string
                      stderr:
                        type: string
                      qemu_stdout:
                        type: string
                        deprecated: true
                      qemu_stderr:
                        type: string
                        deprecated: true
  /sessions/{session_id}/frame.png:
    get:
      summary: Capture the current framebuffer
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: PNG framebuffer
          headers:
            X-Frame-Width:
              schema:
                type: integer
            X-Frame-Height:
              schema:
                type: integer
          content:
            image/png:
              schema:
                type: string
                format: binary
        "409":
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/input:
    post:
      summary: Inject key or pointer input
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputRequest"
      responses:
        "200":
          description: Input accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/qom:
    post:
      summary: Set a QOM property
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, property]
              properties:
                path:
                  type: string
                  example: /machine/bmi270
                property:
                  type: string
                  example: accel-x
                value: {}
      responses:
        "200":
          description: QOM result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    get:
      summary: Read a QOM property
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: property
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: QOM value
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/reset:
    post:
      summary: Reset the guest
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Reset accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/renew:
    post:
      summary: Extend a lease
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  type: integer
                  minimum: 30
      responses:
        "200":
          description: Renewed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Service error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    DeviceCatalog:
      type: object
      required: [service, api_version, network_enabled, devices]
      properties:
        service:
          type: string
        api_version:
          type: string
        network_enabled:
          type: boolean
        tab5_enabled:
          type: boolean
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    Device:
      type: object
      additionalProperties: true
      properties:
        device_id:
          type: string
        name:
          type: string
        sku:
          type: string
        device_codes:
          type: array
          items:
            type: string
        supported:
          type: boolean
        creatable:
          type: boolean
        backend_ready:
          type: boolean
        missing_runtime_files:
          type: array
          items:
            type: string
        reference_available:
          type: boolean
        flash_size:
          type: integer
        display:
          type: object
          nullable: true
        peripheral_status:
          type: string
        warnings:
          type: array
          items:
            type: string
        network_profiles:
          type: array
          items:
            type: string
            enum: [uiflow2-sticks3, uiflow2-sticks3-wifi, uiflow2-sticks3-unified, uiflow2-cores3-unified, uiflow2-cardputer-adv-unified, uiflow2-stopwatch-unified, uiflow2-atoms3r-unified, uiflow2-papercolor-unified, uiflow2-papermono-unified, uiflow2-stackchan-unified, uiflow2-stamplc-unified, core2-unified, nanoc6-hci-ble, nesso-unified, esp-idf-http, esp-idf-smoke, idf-dns-udp, esp-idf-coex, generic-observe]
        network_console:
          type: string
          enum: [auto, uart0, usb-jtag]
        network_status:
          type: string
          enum: [validated, unverified, board-init-blocked, not-supported]
        firmware_families:
          type: array
          items:
            type: string
        coverage:
          type: object
          additionalProperties: true
        features:
          type: object
          additionalProperties: true
    RuntimeName:
      type: string
      enum: [qemu, network, qemu-wifi, qemu-ble, qemu-unified]
      description: >
        Execution envelope for a session. qemu-unified is the canonical
        one-guest board + radio runtime for *-unified profiles. qemu-ble is a
        compatibility alias used by existing unified clients and by
        radio-specific legacy profiles. qemu-wifi keeps the board and WiFi in
        one guest without starting the external BLE peer. network is the
        separate esp-emu diagnostic lane and cannot establish a whole-device
        PASS by itself.
    NetworkEvidence:
      type: object
      additionalProperties: true
      required: [schema_version, kind, scope, status]
      properties:
        schema_version:
          type: integer
        kind:
          type: string
        scope:
          type: string
          example: simulation-only-not-hardware-validation
        status:
          type: string
          enum: [RUNNING, PASS, PARTIAL, FAIL]
        session_id:
          type: string
        device_id:
          type: string
        profile:
          type: string
        runtime:
          type: object
          additionalProperties: true
          properties:
            name:
              type: string
            guest_process_count:
              type: integer
              minimum: 1
            wifi_nic:
              type: string
            hci_transport:
              type: string
            ble_controller:
              type: string
            ble_peer:
              type: string
        checks:
          type: object
          additionalProperties:
            type: boolean
        policy:
          type: object
          additionalProperties: true
          description: Effective isolation, egress and DNS policy.
        packet_capture:
          type: object
          additionalProperties: true
          description: >
            PASS with a hashed pcap summary, CAPTURING while QEMU is running,
            or NOT_RUN with a reason.
        expected_markers:
          type: array
          items:
            type: string
        not_claimed:
          type: array
          items:
            type: string
    Artifact:
      type: object
      required: [artifact_id, sha256, size, name]
      properties:
        artifact_id:
          type: string
        sha256:
          type: string
        size:
          type: integer
        name:
          type: string
        content_type:
          type: string
        created_at:
          type: string
          format: date-time
    MergedFirmwareRequest:
      type: object
      required: [device_id, kind, artifact_id]
      properties:
        device_id:
          type: string
        kind:
          const: merged
        artifact_id:
          type: string
    SegmentedFirmwareRequest:
      type: object
      required: [device_id, kind, segments]
      properties:
        device_id:
          type: string
        kind:
          const: segmented
        segments:
          type: array
          items:
            type: object
            required: [offset, artifact_id]
            properties:
              offset:
                oneOf:
                  - type: integer
                  - type: string
              artifact_id:
                type: string
    ManifestFirmwareRequest:
      type: object
      required: [device_id, kind, manifest]
      properties:
        device_id:
          type: string
        kind:
          const: manifest
        manifest:
          type: object
          additionalProperties: true
          required: [schema_version, kind, artifact, target, security, provenance, validation]
          description: >
            Versioned m5stack-firmware-manifest. The normalized merged-flash
            artifact must already be uploaded; artifact.artifact_id defaults to
            artifact.sha256 when omitted. Capability, flash-size and security
            mismatches return unsupported_firmware_capability with structured
            issues instead of starting a session.
    Firmware:
      type: object
      additionalProperties: true
      required: [firmware_id, sha256, device_id, flash_size, kind]
      properties:
        firmware_id:
          type: string
        sha256:
          type: string
        device_id:
          type: string
        flash_size:
          type: integer
        kind:
          type: string
        source:
          type: object
        header_magic:
          type: integer
    CreateSessionRequest:
      type: object
      required: [device_id]
      properties:
        device_id:
          type: string
        firmware_id:
          type: string
          description: Omit to use the cached reference UIFlow2 image.
        ttl_seconds:
          type: integer
          minimum: 30
          default: 1800
        ready_marker:
          type: string
        ready_timeout_seconds:
          type: number
          default: 30
        ready:
          $ref: "#/components/schemas/ReadyConditions"
        runtime_env:
          type: object
          description: >
            Trusted-local runtime overrides for the QEMU process. Only
            M5SW_I2S_DMA_IRQ, M5SW_I2S_PCM_FILE, M5SW_I2S_RX_PCM_FILE and
            M5SW_I2S_TRACE are accepted.
          additionalProperties:
            type: string
        runtime:
          allOf:
            - $ref: "#/components/schemas/RuntimeName"
          default: qemu
        network:
          $ref: "#/components/schemas/NetworkExecution"
    NetworkExecution:
      type: object
      required: [profile]
      description: >
        Select the profile for the requested device. runtime=qemu-unified
        requires a one-guest *-unified profile. runtime=qemu-ble remains
        accepted for compatibility and for radio-specific profiles.
      properties:
        profile:
          type: string
          enum: [uiflow2-sticks3, uiflow2-sticks3-wifi, uiflow2-sticks3-unified, uiflow2-cores3-unified, uiflow2-cardputer-adv-unified, uiflow2-stopwatch-unified, uiflow2-atoms3r-unified, uiflow2-papercolor-unified, uiflow2-papermono-unified, uiflow2-stackchan-unified, uiflow2-stamplc-unified, core2-openmac, core2-ble-advertise, core2-hci-gatt, core2-unified, nanoc6-hci-ble, nesso-unified, esp-idf-http, esp-idf-smoke, idf-dns-udp, esp-idf-wrong-password, esp-idf-coex, generic-observe]
        wifi:
          type: boolean
        ble:
          type: boolean
        tcp:
          type: boolean
        wifi_ssid:
          type: string
          maxLength: 32
        wifi_password:
          type: string
          maxLength: 63
          writeOnly: true
        firmware_ap_password:
          type: string
          maxLength: 63
          writeOnly: true
          description: >
            Password used when esp-emu joins a SoftAP created by the firmware.
            Use an empty string for an open AP. Open and WPA2-PSK APs are
            supported; WPA3-SAE-only and hidden SSIDs are not. The value is
            redacted from session records, command evidence and serial logs.
        hostfwd:
          type: array
          maxItems: 8
          description: >
            Loopback-only TCP/UDP forwards from the review host into the guest.
            Host addresses are fixed to 127.0.0.1. These forwards can expose a
            firmware provisioning portal without connecting the guest to the
            workstation LAN. TCP forwards reach a firmware-created SoftAP and
            its station path; UDP forwards currently reach only the station
            path. A live session exposes the normalized forwards in its
            network snapshot.
          items:
            type: object
            additionalProperties: false
            required: [protocol, host_port, guest_port]
            properties:
              protocol:
                type: string
                enum: [tcp, udp]
              host_port:
                type: integer
                minimum: 1024
                maximum: 65535
              guest_port:
                type: integer
                minimum: 1
                maximum: 65535
        wifi_auth:
          type: string
          enum: [wpa2-wpa3, wpa3-sae, wpa2-psk, open]
        psram_size:
          type: string
          enum: ["0", 2M, 4M, 8M, 16M, 32M, 64M]
        net_mode:
          type: string
          enum: [user, "user,restrict=yes"]
          description: >
            Guest network backend. generic-observe defaults to
            user,restrict=yes; validated profiles default to user.
            core2-openmac currently supports user only.
            core2-ble-advertise is a same-instance controller bootstrap and
            advertising profile. core2-hci-gatt runs a UIFlow2 HCI-UART test
            image against a Bumble controller and an external GATT peer.
            uiflow2-sticks3-unified runs the S3 WiFi MAC/DMA model, board
            peripherals, controlled HTTP and HCI-UART BLE in one QEMU guest.
            uiflow2-cores3-unified runs the same unified data planes on the
            CoreS3 board profile, including touch, AXP2101, BMI270, AW88298,
            WiFi DHCP/HTTP and HCI-UART BLE.
            uiflow2-cardputer-adv-unified runs the Cardputer ADV display,
            keyboard, BMI270, ES8311/NS4150B audio, WiFi DHCP/HTTP and
            HCI-UART BLE in one QEMU guest.
            uiflow2-stopwatch-unified runs the StopWatch 466x466 display,
            touch, M5PM1, M5IOE1/AW8737A amplifier, BMI270, ES8311 audio,
            WiFi DHCP/HTTP and HCI-UART BLE in one QEMU guest.
            uiflow2-atoms3r-unified runs the AtomS3R display, button,
            BMI270, BMM150, LP5562, WiFi DHCP/HTTP and HCI-UART BLE in one
            QEMU guest.
            uiflow2-papercolor-unified runs the PaperColor 400x600 display,
            buttons, M5PM1, SHT40, ES8311/AW8737A audio, WiFi DHCP/HTTP and
            HCI-UART BLE in one QEMU guest.
            uiflow2-papermono-unified runs the PaperMono 480x800 display,
            touch, keys, M5PM1/IP2315, BMI270, RX8130, RGB, speaker, WiFi
            DHCP/HTTP and HCI-UART BLE in one QEMU guest.
            uiflow2-stackchan-unified runs the StackChan 320x240 display,
            touch, camera, IMU/magnetometer, power/audio/IR/NFC/servo,
            WiFi DHCP/HTTP and UART2 HCI BLE in one QEMU guest.
            uiflow2-stamplc-unified runs the StamPLC 240x135 display,
            keys/RGB, relay/input banks, CAN, PWR-485, buzzer, WiFi
            DHCP/HTTP and UART1 HCI BLE in one QEMU guest.
            core2-unified runs display/touch, AXP2101/INA3221, IMU/RTC,
            speaker/microphone, OpenMAC WiFi DHCP/HTTP and UART1 HCI BLE
            in one m5core2 guest when M5_CORE2_RADIO_QEMU is configured.
            nanoc6-hci-ble runs NanoC6 RGB/button/IR, QEMU ESP32-C6 WiFi
            DHCP/HTTP and UART1 HCI BLE in one ESP32-C6 guest.
            nesso-unified runs Nesso N1 display/touch, PI4IOE, power telemetry,
            BMI270, SX1262, IR, buzzer, QEMU ESP32-C6 WiFi DHCP/HTTP and
            UART1 HCI BLE in one ESP32-C6 guest; the stock UIFlow2 RGB API is
            explicitly NOT RUN.
        capture_pcap:
          type: boolean
          default: true
          description: >
            Capture QEMU Ethernet traffic through filter-dump. runtime=network
            rejects true because esp-emu user networking exposes no pcap path.
            Stopping the session writes network.pcap.json with flow, DNS, DHCP,
            ARP and payload hashes but no raw payloads.
        policy:
          type: object
          additionalProperties: false
          description: >
            Fail-closed network policy. namespace isolation is Linux-only and
            refuses to start if a private network namespace cannot be created.
            The sandbox exposes loopback lab fixtures and no external route.
          properties:
            isolation:
              type: string
              enum: [trusted-host, namespace]
              default: trusted-host
            egress:
              type: string
              enum: [native, deny-all, lab-only]
              default: native
            dns:
              type: string
              enum: [slirp, deny]
              default: slirp
        console_mode:
          type: string
          enum: [auto, uart0, usb-jtag]
          description: >
            Guest console used for observation. generic-observe uses the
            device's network_console value when declared, otherwise auto;
            validated profiles default to uart0.
        ble_name:
          type: string
          minLength: 1
          maxLength: 29
        elf_artifact_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        expected_markers:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 200
        attempts:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: >
            Core2 QEMU startup attempts. Core2 radio runs use deterministic
            TCG/icount scheduling; retries remain available for diagnostics but
            are not evidence that a failed first attempt was repaired.
        i2c_devices:
          type: array
          maxItems: 32
          description: >
            Static register-file endpoints behind the emulated SoC I2C
            controller. These are for board bootstrap and register identity
            only; they do not claim a complete keyboard, PMIC, touch or sensor
            data plane.
          items:
            type: string
            pattern: '^[01]:0x[0-9A-Fa-f]{2}(,(width=[12]|fill=0x[0-9A-Fa-f]{2}|reg=0x[0-9A-Fa-f]{2}=0x[0-9A-Fa-f]{2}))*$'
        timeout_seconds:
          type: number
          minimum: 5
          maximum: 300
          default: 60
    Session:
      type: object
      additionalProperties: true
      required: [session_id, device_id, state]
      properties:
        session_id:
          type: string
        device_id:
          type: string
        state:
          type: string
          enum:
            - provisioning
            - flashing
            - booting
            - running
            - stopping
            - stopped
            - failed
        pid:
          type: integer
          nullable: true
        firmware_id:
          type: string
        firmware_sha256:
          type: string
        firmware_source:
          type: string
        runtime:
          $ref: "#/components/schemas/RuntimeName"
        network:
          type: object
          nullable: true
          additionalProperties: true
        artifact_sha256:
          type: string
          nullable: true
        source_artifacts:
          type: array
          items:
            type: string
        flash:
          type: object
          nullable: true
        flash_retained:
          type: boolean
          description: >
            True while the session-private virtual flash file exists. It is
            released when a session stops unless retain_flash is requested.
        serial_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        error:
          type: string
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        event_count:
          type: integer
        restored:
          type: boolean
          description: True when the record was reconstructed from persisted session metadata.
        interrupted:
          type: boolean
          description: True when a previously active session lost its runtime because the service restarted.
        last_frame_available:
          type: boolean
        last_frame_captured_at:
          type: string
          format: date-time
          nullable: true
        device_state_supported:
          type: boolean
        last_device_state_available:
          type: boolean
        last_device_state_at:
          type: string
          format: date-time
          nullable: true
    ReadyConditions:
      type: object
      properties:
        serial_markers:
          type: array
          items:
            type: string
        frame_nonblank:
          type: boolean
        frame_min_bytes:
          type: integer
          default: 1024
        frame_min_nonblack_pixels:
          type: integer
          default: 16
        require_all:
          type: boolean
          default: true
    SerialChunk:
      type: object
      required: [session_id, offset, next_offset, data, bytes]
      properties:
        session_id:
          type: string
        offset:
          type: integer
        next_offset:
          type: integer
        data:
          type: string
        bytes:
          type: integer
    InputRequest:
      oneOf:
        - type: object
          required: [kind, key]
          properties:
            kind:
              const: key
            key:
              type: string
            action:
              type: string
              enum: [tap, down, up]
              default: tap
              description: >
                Omit or use tap for a complete press/release. Use down and up
                separately for a model button that is physically held.
            settle_seconds:
              type: number
        - type: object
          required: [kind, x, y]
          properties:
            kind:
              const: touch
            x:
              type: integer
            y:
              type: integer
            settle_seconds:
              type: number
        - type: object
          required: [kind, x, y]
          properties:
            kind:
              const: longpress
            x:
              type: integer
            y:
              type: integer
            hold_seconds:
              type: number
        - type: object
          required: [kind, x1, y1, x2, y2]
          properties:
            kind:
              const: drag
            x1:
              type: integer
            y1:
              type: integer
            x2:
              type: integer
            y2:
              type: integer
    Capacity:
      type: object
      additionalProperties: true
