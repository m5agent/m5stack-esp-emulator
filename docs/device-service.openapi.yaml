openapi: 3.1.0
info:
  title: M5Stack Device Service API
  version: 1.21.0
  description: >
    Leased, on-demand virtual M5Stack device service. QEMU unified sessions
    keep board and radio evidence in one guest; separate esp-emu network/BLE
    sessions remain available for diagnostics. Every session uses an isolated
    firmware copy. The local worker persists heartbeat, lease, drain and
    restart-classification state under an exclusive state-directory lock. A
    persistent directory records remote-worker identity, generation,
    heartbeat, capabilities and bounded result metadata. A separate durable
    job queue stores idempotent requests, capability requirements, worker
    leases, retries and terminal results. It is a pull-based queue and
    supervisor, not an executor or active-process re-attach mechanism.
    A local running QEMU process can be re-attached after PID start-time,
    session QMP ownership and query-status checks; this restores QEMU/QMP
    control only, not companion helper or evidence-stream continuity.
    The service can be exposed over HTTPS with verified server certificates
    and optional required client certificates (mTLS); worker HMAC remains a
    separate application authentication layer.
    CardputerZero is outside this API version. Tab5 is available through
    esp-emu with partial peripheral status.
servers:
  - url: http://127.0.0.1:8787/api/v1
  - url: https://{host}/api/v1
    variables:
      host:
        default: device-service.example
        description: TLS-enabled Device Service host.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Service health and capacity
      security: []
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /devices:
    get:
      summary: List virtual device profiles
      parameters:
        - name: include_unsupported
          in: query
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
      responses:
        "200":
          description: Device catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCatalog"
  /devices/{device_id}:
    get:
      summary: Read one virtual device profile
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          $ref: "#/components/responses/Error"
  /capacity:
    get:
      summary: Read active lease capacity
      responses:
        "200":
          description: Capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capacity"
  /worker:
    get:
      summary: Read the local worker lifecycle state
      responses:
        "200":
          description: Worker identity, generation, heartbeat and lease state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "503":
          $ref: "#/components/responses/Error"
  /worker/drain:
    post:
      summary: Stop admitting new leases and drain active leases
      responses:
        "200":
          description: Worker and currently active session leases
          content:
            application/json:
              schema:
                type: object
                required: [worker, active_sessions]
                properties:
                  worker:
                    $ref: "#/components/schemas/Worker"
                  active_sessions:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "409":
          $ref: "#/components/responses/Error"
  /worker/resume:
    post:
      summary: Resume lease admission for a drained worker
      responses:
        "200":
          description: Worker resumed
          content:
            application/json:
              schema:
                type: object
                required: [worker]
                properties:
                  worker:
                    $ref: "#/components/schemas/Worker"
        "409":
          $ref: "#/components/responses/Error"
  /workers:
    get:
      summary: List registered remote simulator workers
      responses:
        "200":
          description: Persistent remote-worker directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteWorkerList"
    post:
      summary: Register a remote simulator worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteWorkerRegistration"
      responses:
        "201":
          description: Worker registered or an idempotent retry was accepted
          content:
            application/json:
              schema:
                type: object
                required: [worker]
                properties:
                  worker:
                    $ref: "#/components/schemas/RemoteWorker"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /workers/{worker_id}/heartbeat:
    post:
      summary: Refresh a remote worker heartbeat
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteWorkerHeartbeat"
      responses:
        "200":
          description: Updated remote-worker state
          content:
            application/json:
              schema:
                type: object
                required: [worker]
                properties:
                  worker:
                    $ref: "#/components/schemas/RemoteWorker"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /workers/{worker_id}/drain:
    post:
      summary: Stop assigning new leases to a remote worker
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteWorkerIdentity"
      responses:
        "200":
          description: Worker draining or drained
          content:
            application/json:
              schema:
                type: object
                required: [worker]
                properties:
                  worker:
                    $ref: "#/components/schemas/RemoteWorker"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /workers/{worker_id}/stop:
    post:
      summary: Mark a remote worker stopped
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteWorkerIdentity"
      responses:
        "200":
          description: Worker stopped
          content:
            application/json:
              schema:
                type: object
                required: [worker]
                properties:
                  worker:
                    $ref: "#/components/schemas/RemoteWorker"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /workers/{worker_id}/results:
    post:
      summary: Append bounded result metadata for a remote worker
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteWorkerResultRequest"
      responses:
        "201":
          description: Recorded result metadata
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/RemoteWorkerResult"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /jobs:
    get:
      summary: List durable remote-worker jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, leased, completed, failed, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Persistent job queue snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerJobList"
        "400":
          $ref: "#/components/responses/Error"
    post:
      summary: Submit an idempotent durable job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerJobSubmit"
      responses:
        "201":
          description: Job queued or an idempotent replay returned
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: "#/components/schemas/WorkerJob"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /jobs/claim:
    post:
      summary: Claim the oldest matching queued job for a ready worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerJobClaim"
      responses:
        "200":
          description: Claimed job, or null when no matching job is queued
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    oneOf:
                      - $ref: "#/components/schemas/WorkerJob"
                      - type: "null"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /jobs/{job_id}:
    get:
      summary: Read one durable job
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: "#/components/schemas/WorkerJob"
        "404":
          $ref: "#/components/responses/Error"
  /jobs/{job_id}/heartbeat:
    post:
      summary: Extend a job lease owned by a specific worker generation
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerJobLeaseRequest"
      responses:
        "200":
          description: Renewed job lease
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: "#/components/schemas/WorkerJob"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /jobs/{job_id}/result:
    post:
      summary: Record a terminal result and optional evidence hash
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerJobResultRequest"
      responses:
        "200":
          description: Completed or failed job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: "#/components/schemas/WorkerJob"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /jobs/{job_id}/cancel:
    post:
      summary: Cancel a queued or leased job
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 256
      responses:
        "200":
          description: Cancelled job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    $ref: "#/components/schemas/WorkerJob"
        "404":
          $ref: "#/components/responses/Error"
  /storage:
    get:
      summary: Read retained-session, cache and disk usage
      responses:
        "200":
          description: Storage inventory and active retention policy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /storage/prune:
    post:
      summary: Apply retention and optionally garbage-collect unreferenced caches
      parameters:
        - name: include_cache
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Prune result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /artifact-uploads:
    post:
      summary: Start a resumable streaming artifact upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactUploadCreate"
      responses:
        "202":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactUpload"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "507":
          $ref: "#/components/responses/Error"
  /artifact-uploads/{upload_id}:
    get:
      summary: Read streaming upload state
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Upload state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactUpload"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Abort a streaming upload
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Upload aborted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactUploadAbort"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /artifact-uploads/{upload_id}/chunks:
    post:
      summary: Append one contiguous artifact chunk
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: X-Chunk-Offset
          in: header
          required: true
          schema:
            type: integer
            minimum: 0
        - name: X-Chunk-SHA256
          in: header
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Chunk accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactUploadProgress"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "507":
          $ref: "#/components/responses/Error"
  /artifact-uploads/{upload_id}/complete:
    post:
      summary: Verify and commit a streaming artifact
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "201":
          description: Artifact committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /artifacts:
    get:
      summary: List uploaded artifacts
      responses:
        "200":
          description: Artifact list
          content:
            application/json:
              schema:
                type: object
                properties:
                  artifacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artifact"
    post:
      summary: Upload a content-addressed binary artifact
      parameters:
        - name: X-Artifact-Name
          in: header
          schema:
            type: string
        - name: X-Artifact-Type
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Artifact metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "413":
          $ref: "#/components/responses/Error"
        "507":
          $ref: "#/components/responses/Error"
  /artifacts/{artifact_id}:
    get:
      summary: Read artifact metadata
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Artifact metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an artifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact deleted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /firmware/import:
    post:
      summary: Normalize a firmware package and create a validated firmware
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmwareImportRequest"
      responses:
        "201":
          description: Normalized firmware metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "507":
          $ref: "#/components/responses/Error"
  /firmware:
    post:
      summary: Compose and validate a flash-sized firmware image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MergedFirmwareRequest"
                - $ref: "#/components/schemas/SegmentedFirmwareRequest"
                - $ref: "#/components/schemas/ManifestFirmwareRequest"
      responses:
        "201":
          description: Firmware metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "400":
          $ref: "#/components/responses/Error"
        "507":
          $ref: "#/components/responses/Error"
  /firmware/{firmware_id}:
    get:
      summary: Read firmware metadata
      parameters:
        - name: firmware_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Firmware metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firmware"
        "404":
          $ref: "#/components/responses/Error"
  /firmware/analyze:
    post:
      summary: Analyze an existing firmware image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firmware_id]
              properties:
                firmware_id:
                  type: string
      responses:
        "200":
          description: Static firmware analysis
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /firmware/{firmware_id}/analysis:
    get:
      summary: Read firmware analysis
      parameters:
        - name: firmware_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Static firmware analysis
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions:
    get:
      summary: List leases and retained session history
      parameters:
        - name: include_stopped
          in: query
          description: Set to 0 to return active leases only. The default includes stopped and failed sessions while they remain retained.
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
    post:
      summary: Create an asynchronous device lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "202":
          description: Session accepted for provisioning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "507":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    delete:
      summary: Clear stopped or failed session history
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [stopped, failed]
        - name: purge
          in: query
          schema:
            type: boolean
            default: true
        - name: retain_flash
          in: query
          description: Keep full virtual flash files while retaining stopped/failed history.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Clear result
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared:
                    type: integer
                  orphaned_cleared:
                    type: integer
                  purged:
                    type: boolean
  /sessions/{session_id}:
    get:
      summary: Read session state
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Stop a session
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: purge
          in: query
          schema:
            type: boolean
            default: false
        - name: retain_flash
          in: query
          description: Retain the full mutable virtual flash after stop. It is released by default.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Stopped session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /sessions/{session_id}/events:
    get:
      summary: Read session lifecycle events
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session events
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /sessions/{session_id}/network:
    get:
      summary: Read machine-readable radio evidence for one session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: >
            WiFi/BLE slice of the current QEMU lease, or RUNNING before
            completion. Unified profiles also keep frame, input, device-state
            and audio evidence in the same session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkEvidence"
        "409":
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/network-fault:
    post:
      summary: Remove or restore a QEMU link/radio for reconnect tests
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [down, up]
                  description: Stops or restores the selected link/radio target.
                target:
                  type: string
                  enum: [link, radio]
                  default: link
                  description: >
                    link uses QMP set_link on wifi0; radio toggles the QEMU
                    WiFi model's radio-enabled QOM property so beacons and
                    management replies stop.
      responses:
        "200":
          description: Link state changed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/device-state:
    get:
      summary: Read normalized device runtime state
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Live or persisted device component state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  session_id:
                    type: string
                  device_id:
                    type: string
                  state:
                    type: string
                  supported:
                    type: boolean
                  available:
                    type: boolean
                  source:
                    type: string
                    enum: [live, persisted]
                  captured_at:
                    type: string
                    format: date-time
                  components:
                    type: object
                    additionalProperties: true
                  errors:
                    type: object
                    additionalProperties: true
  /sessions/{session_id}/evidence:
    get:
      summary: Download an evidence ZIP
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: include
          in: query
          schema:
            type: string
            default: manifest,serial,frames,logs,qom
      responses:
        "200":
          description: Evidence ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /sessions/{session_id}/qom/list:
    get:
      summary: List QOM properties at a path
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: path
          in: query
          schema:
            type: string
            default: /machine
      responses:
        "200":
          description: QOM property list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/qom-snapshot:
    post:
      summary: Store a recursive QOM snapshot
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  default: /machine
                depth:
                  type: integer
                  default: 2
                max_nodes:
                  type: integer
                  default: 500
      responses:
        "200":
          description: QOM snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/qom/diff:
    get:
      summary: Diff two stored QOM snapshots
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: before
          in: query
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: QOM snapshot diff
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/flash:
    get:
      summary: Read current virtual flash metadata or bytes
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: format
          in: query
          schema:
            type: string
            enum: [sha256, bin]
            default: sha256
      responses:
        "200":
          description: Flash metadata or binary image
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/octet-stream:
              schema:
                type: string
                format: binary
  /sessions/{session_id}/flash-snapshot:
    post:
      summary: Store a virtual flash snapshot
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Flash snapshot metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/flash/diff:
    get:
      summary: Diff two virtual flash snapshots
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: before
          in: query
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Flash snapshot diff
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/wait:
    post:
      summary: Wait for running state or a serial marker
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ready_marker:
                  type: string
                timeout_seconds:
                  type: number
                  default: 30
                wait_for_completion:
                  type: boolean
                  default: false
                  description: Wait until a one-shot network session stops or fails.
                ready:
                  $ref: "#/components/schemas/ReadyConditions"
      responses:
        "200":
          description: Session is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "408":
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/serial:
    get:
      summary: Read serial output incrementally
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 262144
            default: 65536
      responses:
        "200":
          description: Serial chunk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialChunk"
  /sessions/{session_id}/logs:
    get:
      summary: Read serial plus runtime log tails
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Log chunks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SerialChunk"
                  - type: object
                    properties:
                      runtime:
                        $ref: "#/components/schemas/RuntimeName"
                      stdout:
                        type: string
                      stderr:
                        type: string
                      qemu_stdout:
                        type: string
                        deprecated: true
                      qemu_stderr:
                        type: string
                        deprecated: true
  /sessions/{session_id}/frame.png:
    get:
      summary: Capture the current framebuffer
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: PNG framebuffer
          headers:
            X-Frame-Width:
              schema:
                type: integer
            X-Frame-Height:
              schema:
                type: integer
          content:
            image/png:
              schema:
                type: string
                format: binary
        "409":
          $ref: "#/components/responses/Error"
  /sessions/{session_id}/input:
    post:
      summary: Inject key or pointer input
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputRequest"
      responses:
        "200":
          description: Input accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/qom:
    post:
      summary: Set a QOM property
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, property]
              properties:
                path:
                  type: string
                  example: /machine/bmi270
                property:
                  type: string
                  example: accel-x
                value: {}
      responses:
        "200":
          description: QOM result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    get:
      summary: Read a QOM property
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: property
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: QOM value
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/reset:
    post:
      summary: Reset the guest
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Reset accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /sessions/{session_id}/renew:
    post:
      summary: Extend a lease
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds:
                  type: integer
                  minimum: 30
      responses:
        "200":
          description: Renewed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        When an API token is configured, worker-only mutation endpoints also
        require X-M5-Worker-Id, X-M5-Worker-Instance,
        X-M5-Worker-Generation, X-M5-Worker-Timestamp, X-M5-Worker-Nonce and
        X-M5-Worker-Signature. The signature is HMAC-SHA256 over method, path,
        timestamp, nonce and body SHA256 using a key derived from the master
        token and worker identity/generation.
      x-worker-auth:
        timestamp_window_seconds: 90
        nonce_replay_cache: true
        protected_operations:
          - POST /jobs/claim
          - POST /jobs/{job_id}/heartbeat
          - POST /jobs/{job_id}/result
          - POST /workers/{worker_id}/heartbeat
          - POST /workers/{worker_id}/drain
          - POST /workers/{worker_id}/stop
          - POST /workers/{worker_id}/results
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
    WorkerId:
      name: worker_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  responses:
    Error:
      description: Service error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    DeviceCatalog:
      type: object
      required: [service, api_version, network_enabled, devices]
      properties:
        service:
          type: string
        api_version:
          type: string
        network_enabled:
          type: boolean
        tab5_enabled:
          type: boolean
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    Device:
      type: object
      additionalProperties: true
      properties:
        device_id:
          type: string
        name:
          type: string
        sku:
          type: string
        device_codes:
          type: array
          items:
            type: string
        supported:
          type: boolean
        creatable:
          type: boolean
        backend_ready:
          type: boolean
        missing_runtime_files:
          type: array
          items:
            type: string
        reference_available:
          type: boolean
        flash_size:
          type: integer
        display:
          type: object
          nullable: true
        peripheral_status:
          type: string
        warnings:
          type: array
          items:
            type: string
        network_profiles:
          type: array
          items:
            type: string
            enum: [uiflow2-sticks3, uiflow2-sticks3-wifi, uiflow2-sticks3-unified, uiflow2-cores3-unified, uiflow2-cardputer-adv-unified, uiflow2-stopwatch-unified, uiflow2-atoms3r-unified, uiflow2-papercolor-unified, uiflow2-papermono-unified, uiflow2-stackchan-unified, uiflow2-stamplc-unified, core2-unified, core2-native-hci, core2-native-vhci, nanoc6-hci-ble, nesso-unified, esp-idf-http, esp-idf-smoke, idf-dns-udp, esp-idf-coex, generic-observe]
        network_console:
          type: string
          enum: [auto, uart0, usb-jtag]
        network_status:
          type: string
          enum: [validated, unverified, board-init-blocked, not-supported]
        firmware_families:
          type: array
          items:
            type: string
        coverage:
          type: object
          additionalProperties: true
        features:
          type: object
          additionalProperties: true
    RuntimeName:
      type: string
      enum: [qemu, network, qemu-wifi, qemu-ble, qemu-unified]
      description: >
        Execution envelope for a session. qemu-unified is the canonical
        one-guest board + radio runtime for *-unified profiles. qemu-ble is a
        compatibility alias used by existing unified clients and by
        radio-specific legacy profiles. qemu-wifi keeps the board and WiFi in
        one guest without starting the external BLE peer. network is the
        separate esp-emu diagnostic lane and cannot establish a whole-device
        PASS by itself.
    NetworkEvidence:
      type: object
      additionalProperties: true
      required: [schema_version, kind, scope, status]
      properties:
        schema_version:
          type: integer
        kind:
          type: string
        scope:
          type: string
          example: simulation-only-not-hardware-validation
        status:
          type: string
          enum: [RUNNING, PASS, PARTIAL, FAIL]
        session_id:
          type: string
        device_id:
          type: string
        profile:
          type: string
        runtime:
          type: object
          additionalProperties: true
          properties:
            name:
              type: string
            guest_process_count:
              type: integer
              minimum: 1
            wifi_nic:
              type: string
            hci_transport:
              type: string
            ble_controller:
              type: string
            ble_peer:
              type: string
        checks:
          type: object
          additionalProperties:
            type: boolean
        policy:
          type: object
          additionalProperties: true
          description: Effective isolation, egress and DNS policy.
        packet_capture:
          type: object
          additionalProperties: true
          description: >
            PASS with a hashed pcap summary, CAPTURING while QEMU is running,
            or NOT_RUN with a reason. DHCP summaries distinguish initial DORA,
            renewal requests and correlated ACKs without retaining payloads.
        expected_markers:
          type: array
          items:
            type: string
        not_claimed:
          type: array
          items:
            type: string
    ArtifactUploadCreate:
      type: object
      required: [expected_size, expected_sha256]
      properties:
        expected_size:
          type: integer
          minimum: 1
          maximum: 100663296
        expected_sha256:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        name:
          type: string
        content_type:
          type: string
    ArtifactUpload:
      type: object
      required:
        - upload_id
        - status
        - expected_size
        - expected_sha256
        - received_bytes
        - chunks
        - name
        - content_type
        - created_at
        - updated_at
      properties:
        upload_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        status:
          type: string
          enum: [uploading, completed]
        expected_size:
          type: integer
        expected_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        received_bytes:
          type: integer
        chunks:
          type: integer
        name:
          type: string
        content_type:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        artifact_id:
          type:
            - string
            - "null"
          pattern: "^[0-9a-f]{64}$"
    ArtifactUploadProgress:
      allOf:
        - $ref: "#/components/schemas/ArtifactUpload"
        - type: object
          required: [next_offset]
          properties:
            next_offset:
              type: integer
    ArtifactUploadAbort:
      type: object
      required: [upload_id, aborted, received_bytes]
      properties:
        upload_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        aborted:
          type: boolean
        received_bytes:
          type: integer
    Artifact:
      type: object
      required: [artifact_id, sha256, size, name]
      properties:
        artifact_id:
          type: string
        sha256:
          type: string
        size:
          type: integer
        name:
          type: string
        content_type:
          type: string
        created_at:
          type: string
          format: date-time
    FirmwareImportRequest:
      type: object
      required: [device_id, artifact_id]
      properties:
        device_id:
          type: string
        artifact_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
    MergedFirmwareRequest:
      type: object
      required: [device_id, kind, artifact_id]
      properties:
        device_id:
          type: string
        kind:
          const: merged
        artifact_id:
          type: string
    SegmentedFirmwareRequest:
      type: object
      required: [device_id, kind, segments]
      properties:
        device_id:
          type: string
        kind:
          const: segmented
        segments:
          type: array
          items:
            type: object
            required: [offset, artifact_id]
            properties:
              offset:
                oneOf:
                  - type: integer
                  - type: string
              artifact_id:
                type: string
    ManifestFirmwareRequest:
      type: object
      required: [device_id, kind, manifest]
      properties:
        device_id:
          type: string
        kind:
          const: manifest
        manifest:
          type: object
          additionalProperties: true
          required: [schema_version, kind, artifact, target, security, provenance, validation]
          description: >
            Versioned m5stack-firmware-manifest. The normalized merged-flash
            artifact must already be uploaded; artifact.artifact_id defaults to
            artifact.sha256 when omitted. Capability, flash-size and security
            mismatches return unsupported_firmware_capability with structured
            issues instead of starting a session.
    Firmware:
      type: object
      additionalProperties: true
      required: [firmware_id, sha256, device_id, flash_size, kind]
      properties:
        firmware_id:
          type: string
        sha256:
          type: string
        device_id:
          type: string
        flash_size:
          type: integer
        kind:
          type: string
        source:
          type: object
        header_magic:
          type: integer
    CreateSessionRequest:
      type: object
      required: [device_id]
      properties:
        device_id:
          type: string
        firmware_id:
          type: string
          description: Omit to use the cached reference UIFlow2 image.
        ttl_seconds:
          type: integer
          minimum: 30
          default: 1800
        owner:
          type: string
          maxLength: 128
          description: Optional non-secret label stored with the worker lease.
        ready_marker:
          type: string
        ready_timeout_seconds:
          type: number
          default: 30
        ready:
          $ref: "#/components/schemas/ReadyConditions"
        runtime_env:
          type: object
          description: >
            Trusted-local runtime overrides for the QEMU process. Only
            M5SW_I2S_DMA_IRQ, M5SW_I2S_PCM_FILE, M5SW_I2S_RX_PCM_FILE and
            M5SW_I2S_TRACE are accepted.
          additionalProperties:
            type: string
        runtime:
          allOf:
            - $ref: "#/components/schemas/RuntimeName"
          default: qemu
        network:
          $ref: "#/components/schemas/NetworkExecution"
    NetworkExecution:
      type: object
      required: [profile]
      description: >
        Select the profile for the requested device. runtime=qemu-unified
        requires a one-guest *-unified profile. runtime=qemu-ble remains
        accepted for compatibility and for radio-specific profiles.
      properties:
        profile:
          type: string
          enum: [uiflow2-sticks3, uiflow2-sticks3-wifi, uiflow2-sticks3-unified, uiflow2-cores3-unified, uiflow2-cardputer-adv-unified, uiflow2-stopwatch-unified, uiflow2-atoms3r-unified, uiflow2-papercolor-unified, uiflow2-papermono-unified, uiflow2-stackchan-unified, uiflow2-stamplc-unified, core2-openmac, core2-ble-advertise, core2-hci-gatt, core2-unified, core2-native-hci, core2-native-vhci, nanoc6-hci-ble, nesso-unified, esp-idf-http, esp-idf-smoke, idf-dns-udp, esp-idf-wrong-password, esp-idf-coex, generic-observe]
        wifi:
          type: boolean
        ble:
          type: boolean
        tcp:
          type: boolean
        wifi_ssid:
          type: string
          maxLength: 32
        wifi_password:
          type: string
          maxLength: 63
          writeOnly: true
        firmware_ap_password:
          type: string
          maxLength: 63
          writeOnly: true
          description: >
            Password used when esp-emu joins a SoftAP created by the firmware.
            Use an empty string for an open AP. Open and WPA2-PSK APs are
            supported; WPA3-SAE-only and hidden SSIDs are not. The value is
            redacted from session records, command evidence and serial logs.
        hostfwd:
          type: array
          maxItems: 8
          description: >
            Loopback-only TCP/UDP forwards from the review host into the guest.
            Host addresses are fixed to 127.0.0.1. These forwards can expose a
            firmware provisioning portal without connecting the guest to the
            workstation LAN. TCP forwards reach a firmware-created SoftAP and
            its station path; UDP forwards currently reach only the station
            path. A live session exposes the normalized forwards in its
            network snapshot.
          items:
            type: object
            additionalProperties: false
            required: [protocol, host_port, guest_port]
            properties:
              protocol:
                type: string
                enum: [tcp, udp]
              host_port:
                type: integer
                minimum: 1024
                maximum: 65535
              guest_port:
                type: integer
                minimum: 1
                maximum: 65535
        wifi_auth:
          type: string
          enum: [wpa2-wpa3, wpa3-sae, wpa2-psk, open]
        psram_size:
          type: string
          enum: ["0", 2M, 4M, 8M, 16M, 32M, 64M]
        net_mode:
          type: string
          enum: [user, "user,restrict=yes"]
          description: >
            Guest network backend. generic-observe defaults to
            user,restrict=yes; validated profiles default to user.
            core2-openmac currently supports user only.
            core2-ble-advertise is a same-instance controller bootstrap and
            advertising profile. core2-hci-gatt runs a UIFlow2 HCI-UART test
            image against a Bumble controller and an external GATT peer.
            uiflow2-sticks3-unified runs the S3 WiFi MAC/DMA model, board
            peripherals, controlled HTTP and HCI-UART BLE in one QEMU guest.
            uiflow2-cores3-unified runs the same unified data planes on the
            CoreS3 board profile, including touch, AXP2101, BMI270, AW88298,
            WiFi DHCP/HTTP and HCI-UART BLE.
            uiflow2-cardputer-adv-unified runs the Cardputer ADV display,
            keyboard, BMI270, ES8311/NS4150B audio, WiFi DHCP/HTTP and
            HCI-UART BLE in one QEMU guest.
            uiflow2-stopwatch-unified runs the StopWatch 466x466 display,
            touch, M5PM1, M5IOE1/AW8737A amplifier, BMI270, ES8311 audio,
            WiFi DHCP/HTTP and HCI-UART BLE in one QEMU guest.
            uiflow2-atoms3r-unified runs the AtomS3R display, button,
            BMI270, BMM150, LP5562, WiFi DHCP/HTTP and HCI-UART BLE in one
            QEMU guest.
            uiflow2-papercolor-unified runs the PaperColor 400x600 display,
            buttons, M5PM1, SHT40, ES8311/AW8737A audio, WiFi DHCP/HTTP and
            HCI-UART BLE in one QEMU guest.
            uiflow2-papermono-unified runs the PaperMono 480x800 display,
            touch, keys, M5PM1/IP2315, BMI270, RX8130, RGB, speaker, WiFi
            DHCP/HTTP and HCI-UART BLE in one QEMU guest.
            uiflow2-stackchan-unified runs the StackChan 320x240 display,
            touch, camera, IMU/magnetometer, power/audio/IR/NFC/servo,
            WiFi DHCP/HTTP and UART2 HCI BLE in one QEMU guest.
            uiflow2-stamplc-unified runs the StamPLC 240x135 display,
            keys/RGB, relay/input banks, CAN, PWR-485, buzzer, WiFi
            DHCP/HTTP and UART1 HCI BLE in one QEMU guest.
            core2-unified runs display/touch, AXP2101/INA3221, IMU/RTC,
            speaker/microphone, OpenMAC WiFi DHCP/HTTP and UART1 HCI BLE
            in one m5core2 guest when M5_CORE2_RADIO_QEMU is configured.
            core2-native-hci is the canonical stock-firmware path. It requires
            network.elf_artifact_id, resolves API/HLI hook addresses from that
            ELF, runs the QEMU esp32-native-hci device and keeps frame/QOM,
            OpenMAC WiFi, public network, pcap and external NUS GATT in one
            lease without a GDB bridge.
            core2-native-vhci runs the stock internal-controller build,
            requires network.elf_artifact_id, pins the ESP32 VHCI symbol
            addresses from that ELF, bridges the real VHCI boundary to
            Bumble, and keeps board/frame/QOM, OpenMAC WiFi, public network
            and external NUS GATT in one diagnostic lease. GDB controls pause,
            callback injection and synthetic return; repeated-lease stability
            was 1/2, so it is a compatibility/diagnostic profile only.
            nanoc6-hci-ble runs NanoC6 RGB/button/IR, QEMU ESP32-C6 WiFi
            DHCP/HTTP and UART1 HCI BLE in one ESP32-C6 guest.
            nesso-unified runs Nesso N1 display/touch, PI4IOE, power telemetry,
            BMI270, SX1262, IR, buzzer, QEMU ESP32-C6 WiFi DHCP/HTTP and
            UART1 HCI BLE in one ESP32-C6 guest; the stock UIFlow2 RGB API is
            explicitly NOT RUN.
        capture_pcap:
          type: boolean
          default: true
          description: >
            Capture QEMU Ethernet traffic through filter-dump. runtime=network
            rejects true because esp-emu user networking exposes no pcap path.
            Stopping the session writes network.pcap.json with flow, DNS, DHCP,
            ARP and payload hashes but no raw payloads.
        ble_linger_seconds:
          type: number
          minimum: 0
          maximum: 600
          default: 20
          description: >
            Keep an external BLE GATT peer connected after its first passing
            exchange. Long unified holds can use this to test an active BLE
            link instead of the expected peer-close queue tail.
        ble_reconnect_cycles:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: >
            Number of complete scan/connect/GATT/disconnect cycles performed by
            the external BLE peer without restarting the guest.
        ble_reconnect_delay_seconds:
          type: number
          minimum: 0
          maximum: 30
          default: 2
          description: >
            Delay between a peer disconnect and the next scan when multiple BLE
            reconnect cycles are requested.
        policy:
          type: object
          additionalProperties: false
          description: >
            Fail-closed network policy. namespace isolation is Linux-only and
            refuses to start if a private network namespace cannot be created.
            lab-only starts loopback fixtures without an external route.
            allowlist installs nftables default-drop rules and permits only
            exact declared endpoints plus required loopback control ports.
          properties:
            isolation:
              type: string
              enum: [trusted-host, namespace]
              default: trusted-host
            egress:
              type: string
              enum: [native, deny-all, lab-only, allowlist]
              default: native
            dns:
              type: string
              enum: [slirp, deny, controlled]
              default: slirp
              description: >
                controlled requires namespace isolation and
                egress=allowlist. It installs a temporary resolver
                configuration in a private mount namespace and serves only
                allowed_hosts.
            allowed_hosts:
              type: array
              maxItems: 32
              uniqueItems: true
              description: >
                Optional HTTP Host and DNS-name allowlist. Required when
                dns=controlled. Filters the Host header at the controlled HTTP
                gateway and provides A records from the controlled resolver.
                Actual network destinations are controlled separately by
                allowed_endpoints.
              items:
                type: string
                pattern: "^[A-Za-z0-9.-]{1,253}$"
            allowed_endpoints:
              type: array
              maxItems: 64
              description: >
                Exact IPv4 protocol/address/port egress grants for
                egress=allowlist. 10.0.2.2 is mapped to the QEMU SLiRP host
                loopback socket; other IPv4 destinations use a per-session
                veth and temporary NAT table. External IPv6, CIDRs and domains
                are rejected. Profiles with a controlled HTTP fixture add the
                fixture endpoint automatically.
              items:
                type: object
                additionalProperties: false
                required: [protocol, address, port]
                properties:
                  protocol:
                    type: string
                    enum: [tcp, udp]
                  address:
                    type: string
                    format: ipv4
                    description: Exact IPv4 address.
                  port:
                    type: integer
                    minimum: 1
                    maximum: 65535
        console_mode:
          type: string
          enum: [auto, uart0, usb-jtag]
          description: >
            Guest console used for observation. generic-observe uses the
            device's network_console value when declared, otherwise auto;
            validated profiles default to uart0.
        ble_name:
          type: string
          minLength: 1
          maxLength: 29
        elf_artifact_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >
            Matching Xtensa ELF artifact. Required by Core2
            core2-native-hci and legacy core2-native-vhci. The ELF must come
            from the exact firmware build; symbol names alone do not make a
            different build compatible with the pinned hook offsets.
        expected_markers:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 200
        attempts:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: >
            Core2 QEMU startup attempts. Core2 radio runs use deterministic
            TCG/icount scheduling; retries remain available for diagnostics but
            are not evidence that a failed first attempt was repaired.
        i2c_devices:
          type: array
          maxItems: 32
          description: >
            Static register-file endpoints behind the emulated SoC I2C
            controller. These are for board bootstrap and register identity
            only; they do not claim a complete keyboard, PMIC, touch or sensor
            data plane.
          items:
            type: string
            pattern: '^[01]:0x[0-9A-Fa-f]{2}(,(width=[12]|fill=0x[0-9A-Fa-f]{2}|reg=0x[0-9A-Fa-f]{2}=0x[0-9A-Fa-f]{2}))*$'
        timeout_seconds:
          type: number
          minimum: 5
          maximum: 300
          default: 60
    Session:
      type: object
      additionalProperties: true
      required: [session_id, device_id, state]
      properties:
        session_id:
          type: string
        device_id:
          type: string
        state:
          type: string
          enum:
            - provisioning
            - flashing
            - booting
            - running
            - stopping
            - stopped
            - failed
        pid:
          type: integer
          nullable: true
        firmware_id:
          type: string
        firmware_sha256:
          type: string
        firmware_source:
          type: string
        runtime:
          $ref: "#/components/schemas/RuntimeName"
        network:
          type: object
          nullable: true
          additionalProperties: true
        artifact_sha256:
          type: string
          nullable: true
        source_artifacts:
          type: array
          items:
            type: string
        flash:
          type: object
          nullable: true
        flash_retained:
          type: boolean
          description: >
            True while the session-private virtual flash file exists. It is
            released when a session stops unless retain_flash is requested.
        serial_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        error:
          type: string
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        event_count:
          type: integer
        restored:
          type: boolean
          description: True when the record was reconstructed from persisted session metadata.
        interrupted:
          type: boolean
          description: >
            True when a previously active session could not be safely
            re-attached after service restart.
        reattached_process:
          type: boolean
          description: >
            True when the current service accepted a previously orphaned QEMU
            process only after PID start-time and QMP ownership checks.
        recovery_scope:
          type: [string, "null"]
          enum: [qemu-control-plane, null]
          description: >
            Re-attach currently restores QEMU/QMP control only. Companion
            HTTP/BLE helper processes and external evidence continuity are not
            implied.
        worker:
          type: object
          additionalProperties: false
          required: [worker_id, generation, lease_active]
          properties:
            worker_id:
              type: string
            generation:
              type: integer
            lease_active:
              type: boolean
        last_frame_available:
          type: boolean
        last_frame_captured_at:
          type: string
          format: date-time
          nullable: true
        device_state_supported:
          type: boolean
        last_device_state_available:
          type: boolean
        last_device_state_at:
          type: string
          format: date-time
          nullable: true
    ReadyConditions:
      type: object
      properties:
        serial_markers:
          type: array
          items:
            type: string
        frame_nonblank:
          type: boolean
        frame_min_bytes:
          type: integer
          default: 1024
        frame_min_nonblack_pixels:
          type: integer
          default: 16
        require_all:
          type: boolean
          default: true
    SerialChunk:
      type: object
      required: [session_id, offset, next_offset, data, bytes]
      properties:
        session_id:
          type: string
        offset:
          type: integer
        next_offset:
          type: integer
        data:
          type: string
        bytes:
          type: integer
    InputRequest:
      oneOf:
        - type: object
          required: [kind, key]
          properties:
            kind:
              const: key
            key:
              type: string
            action:
              type: string
              enum: [tap, down, up]
              default: tap
              description: >
                Omit or use tap for a complete press/release. Use down and up
                separately for a model button that is physically held.
            settle_seconds:
              type: number
        - type: object
          required: [kind, x, y]
          properties:
            kind:
              const: touch
            x:
              type: integer
            y:
              type: integer
            settle_seconds:
              type: number
        - type: object
          required: [kind, x, y]
          properties:
            kind:
              const: longpress
            x:
              type: integer
            y:
              type: integer
            hold_seconds:
              type: number
        - type: object
          required: [kind, x1, y1, x2, y2]
          properties:
            kind:
              const: drag
            x1:
              type: integer
            y1:
              type: integer
            x2:
              type: integer
            y2:
              type: integer
    Capacity:
      type: object
      additionalProperties: true
      properties:
        worker:
          $ref: "#/components/schemas/Worker"
    Worker:
      type: object
      additionalProperties: true
      required: [schema_version, worker_id, generation, state, accepting_leases]
      properties:
        schema_version:
          type: integer
        worker_id:
          type: string
        instance_id:
          type: string
        generation:
          type: integer
        state:
          type: string
          enum: [starting, ready, draining, drained, stopped]
        pid:
          type: integer
        started_at:
          type: string
          format: date-time
        heartbeat_at:
          type: string
          format: date-time
        heartbeat_age_seconds:
          type: number
          nullable: true
        stale:
          type: boolean
        accepting_leases:
          type: boolean
        active_lease_count:
          type: integer
        active_lease_ids:
          type: array
          items:
            type: string
        drained_at:
          type: string
          nullable: true
        capabilities:
          type: object
          additionalProperties: true
        abandoned_leases:
          type: array
          items:
            type: object
            additionalProperties: true
        recent_results:
          type: array
          items:
            type: object
            additionalProperties: true
    RemoteWorkerIdentity:
      type: object
      required: [instance_id, generation]
      properties:
        instance_id:
          type: string
          minLength: 1
          maxLength: 128
        generation:
          type: integer
          minimum: 1
    RemoteWorkerRegistration:
      allOf:
        - $ref: "#/components/schemas/RemoteWorkerIdentity"
        - type: object
          required: [worker_id]
          properties:
            worker_id:
              type: string
              minLength: 1
              maxLength: 128
            stale_after_seconds:
              type: number
              minimum: 2
              maximum: 300
              default: 15
            endpoint:
              type: [string, "null"]
              maxLength: 512
              description: HTTP(S) endpoint without credentials, query or fragment.
            capabilities:
              type: object
              additionalProperties: true
              description: JSON capability metadata, limited to 16 KiB.
            active_lease_ids:
              type: array
              maxItems: 128
              uniqueItems: true
              items:
                type: string
    RemoteWorkerHeartbeat:
      allOf:
        - $ref: "#/components/schemas/RemoteWorkerIdentity"
        - type: object
          properties:
            state:
              type: string
              enum: [ready, draining, drained]
            capabilities:
              type: object
              additionalProperties: true
            active_lease_ids:
              type: array
              maxItems: 128
              uniqueItems: true
              items:
                type: string
    RemoteWorkerResultRequest:
      allOf:
        - $ref: "#/components/schemas/RemoteWorkerIdentity"
        - type: object
          required: [lease_id, state]
          properties:
            lease_id:
              type: string
              minLength: 1
              maxLength: 128
            state:
              type: string
              minLength: 1
              maxLength: 64
            evidence_sha256:
              type: [string, "null"]
              pattern: "^[0-9a-f]{64}$"
    RemoteWorkerResult:
      type: object
      required: [lease_id, state, completed_at]
      properties:
        lease_id:
          type: string
        state:
          type: string
        evidence_sha256:
          type: [string, "null"]
        completed_at:
          type: string
          format: date-time
    RemoteWorker:
      allOf:
        - $ref: "#/components/schemas/RemoteWorkerRegistration"
        - type: object
          required:
            - state
            - stale
            - accepting_leases
            - active_lease_count
            - recent_results
            - registered_at
            - heartbeat_at
          properties:
            state:
              type: string
              enum: [ready, draining, drained, stopped]
            stale:
              type: boolean
            accepting_leases:
              type: boolean
            active_lease_count:
              type: integer
            heartbeat_age_seconds:
              type: [number, "null"]
            registered_at:
              type: string
              format: date-time
            heartbeat_at:
              type: string
              format: date-time
            drained_at:
              type: [string, "null"]
              format: date-time
            stopped_at:
              type: [string, "null"]
              format: date-time
            recent_results:
              type: array
              maxItems: 32
              items:
                $ref: "#/components/schemas/RemoteWorkerResult"
    RemoteWorkerList:
      type: object
      required:
        - schema_version
        - worker_count
        - accepting_count
        - stale_count
        - active_lease_count
        - workers
      properties:
        schema_version:
          type: integer
        updated_at:
          type: [string, "null"]
          format: date-time
        worker_count:
          type: integer
        accepting_count:
          type: integer
        stale_count:
          type: integer
        active_lease_count:
          type: integer
        workers:
          type: array
          items:
            $ref: "#/components/schemas/RemoteWorker"
    WorkerJobIdentity:
      type: object
      required: [worker_id, instance_id, generation]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 128
        instance_id:
          type: string
          minLength: 1
          maxLength: 128
        generation:
          type: integer
          minimum: 1
    WorkerJobSubmit:
      type: object
      required: [request]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 160
        request:
          type: object
          additionalProperties: true
          description: >
            JSON request payload limited to 64 KiB. It must contain job
            parameters rather than credentials, tokens or firmware bytes.
        required_capabilities:
          type: object
          additionalProperties: true
          description: Flat capability requirements matched against worker capabilities.
        max_attempts:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 160
    WorkerJobClaim:
      allOf:
        - $ref: "#/components/schemas/WorkerJobIdentity"
        - type: object
          properties:
            job_id:
              type: string
              minLength: 1
              maxLength: 128
    WorkerJobLeaseRequest:
      allOf:
        - $ref: "#/components/schemas/WorkerJobIdentity"
        - type: object
          required: [lease_id]
          properties:
            lease_id:
              type: string
              minLength: 1
              maxLength: 128
    WorkerJobResultRequest:
      allOf:
        - $ref: "#/components/schemas/WorkerJobLeaseRequest"
        - type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [PASS, PARTIAL, FAIL, REVIEW]
            evidence_sha256:
              type: [string, "null"]
              pattern: "^[0-9a-f]{64}$"
            summary:
              type: object
              additionalProperties: true
              description: JSON evidence summary limited to 8 KiB.
    WorkerJobLease:
      type: object
      required:
        - lease_id
        - worker_id
        - instance_id
        - generation
        - claimed_at
        - heartbeat_at
        - expires_at
      properties:
        lease_id:
          type: string
        worker_id:
          type: string
        instance_id:
          type: string
        generation:
          type: integer
        claimed_at:
          type: string
          format: date-time
        heartbeat_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    WorkerJob:
      type: object
      required:
        - job_id
        - status
        - request
        - required_capabilities
        - max_attempts
        - attempts
        - created_at
        - updated_at
        - idempotent_replay
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, leased, completed, failed, cancelled]
        label:
          type: [string, "null"]
        request:
          type: object
          additionalProperties: true
        request_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        required_capabilities:
          type: object
          additionalProperties: true
        max_attempts:
          type: integer
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lease:
          oneOf:
            - $ref: "#/components/schemas/WorkerJobLease"
            - type: "null"
        last_worker:
          oneOf:
            - $ref: "#/components/schemas/WorkerJobIdentity"
            - type: "null"
        last_released_at:
          type: [string, "null"]
          format: date-time
        last_release_reason:
          type: [string, "null"]
        result:
          type: [object, "null"]
          additionalProperties: true
        failure:
          type: [object, "null"]
          additionalProperties: true
        idempotent_replay:
          type: boolean
    WorkerJobList:
      type: object
      required:
        - schema_version
        - job_count
        - counts
        - jobs
      properties:
        schema_version:
          type: integer
        updated_at:
          type: [string, "null"]
          format: date-time
        job_count:
          type: integer
        counts:
          type: object
          required: [queued, leased, completed, failed, cancelled]
          properties:
            queued:
              type: integer
            leased:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
            cancelled:
              type: integer
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/WorkerJob"
