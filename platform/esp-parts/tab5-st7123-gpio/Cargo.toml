[package]
name = "m5-tab5-gpio-i2c"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
esp-part = { git = "https://github.com/espressif/esp-emulator.git", rev = "34ba27a6e5a3da41743fc861b462cf2452f0ca28" }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft-compact"] }

[profile.release]
lto = true
panic = "abort"
strip = true
opt-level = "z"
codegen-units = 1
