[platformio]
[env:contract]
platform = espressif32@6.10.0
board = m5stack-stamps3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@1.40501.0
    platformio/tool-scons@4.40801.0
board_build.partitions = default_8MB.csv
board_build.flash_mode = qio
board_upload.flash_size = 8MB
build_unflags = -std=gnu++11 -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = -std=gnu++17 -DARDUINO_USB_CDC_ON_BOOT=0 -DCORE_DEBUG_LEVEL=3 -DUART_SCLK_DEFAULT=UART_SCLK_APB
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    arduino-irremote/IRremote@4.5.0
    https://github.com/m5stack/M5Cardputer.git#bf64d3178ab43928fa02365fbe3937cec99716ad
