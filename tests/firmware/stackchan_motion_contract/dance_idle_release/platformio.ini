[platformio]
default_envs = dance_torque_explicit_idle_release

[env]
platform = espressif32@6.10.0
board = m5stack-cores3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@1.40501.0
    platformio/tool-scons@4.40801.0
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=3
    -D UART_SCLK_DEFAULT=UART_SCLK_APB
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.2.35
    crankyoldgit/IRremoteESP8266@2.8.6
    m5stack/M5Unit-NFC@0.1.2
    m5stack/M5HAL@0.1.4
    m5stack/M5UnitUnified@0.6.4
    m5stack/M5Utility@0.3.1
monitor_speed = 115200

[env:dance_torque_explicit_idle_release]
build_src_filter = -<*> +<dance_torque_explicit_idle_release.cpp>
